# ─────────────────────────────────────────────────────────────────
# CAMERA STREAMING SYSTEM — CONFIGURATION
# Both local (sender) and server (receiver) read this same file.
# ─────────────────────────────────────────────────────────────────

server:
  host: "127.0.0.1"
  base_port: 9000
  http_port: 8080
  output_dir: "./recordingsss"
  chunk_time: 120
  encoder: "h265"
  frame_detail: true

rabbitmq:
  enabled: true
  host: "localhost"
  port: 5672
  user: "guest"
  password: "guest"
  exchange: "camera_events"

cameras:
  - id: "camera1"
    name: "Office cam3"
    rtsp_url: "rtsp://admin:Algo_1212@192.168.96.231:554/stream1"
    port_offset: 1
    fps: 25
    bitrate: 900
    width: 1920
    height: 1080
    preset: "ultrafast"
    tune: "zerolatency"
    keyint: 30
    bframes: 2
    enabled: true

